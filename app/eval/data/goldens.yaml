# goldens.yaml — Enterprise Banking Policy RAG Evaluation Set
# Corpus: Meridian Trust Bank policy library, BNK-POL-001 through BNK-POL-065
#         (55 PDF + 10 DOCX; see manifest for id -> filename -> category mapping)
#
# ASSUMPTION: the "sql" and "hybrid_rag_sql" sections assume a companion
# banking-ops Postgres database with tables: loans, complaints, kyc_records,
# fraud_cases, branches, accounts. These are NOT part of the policy document
# corpus — they represent the operational data plane a production copilot
# would also query. Adjust table/column names to your actual schema before
# running against a live Text2SQL router.
#
# Same schema as the reference K8s goldens.yaml:
#   id, question, intent, golden_sources, golden_answer_keywords,
#   demonstrates_feature, expected_baseline, expected_with_feature, notes,
#   (optional) forbidden_keywords

