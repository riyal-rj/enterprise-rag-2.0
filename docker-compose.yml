services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adv_rag
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/adv_rag
      - QDRANT_URL=http://qdrant:6333
      - HYBRID_SEARCH_ENABLED=${HYBRID_SEARCH_ENABLED}
      - UPSTASH_REDIS_URL=${UPSTASH_REDIS_URL}
      - UPSTASH_REDIS_TOKEN=${UPSTASH_REDIS_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_JSON=false
      - LOG_LEVEL=INFO
      # Self-RAG / reflection tuning (overridable via host .env) -
      # enabled/rollout% live in the rag_ops_config DB row, not here (see
      # app/seed/migrations/010_add_self_reflection_rag_ops_config.sql);
      # only static models/thresholds/budgets are deployment settings.
      - REFLECTION_MIN_SCORE=${REFLECTION_MIN_SCORE:-0.85}
      - MAX_REFLECTION_RETRIES=${MAX_REFLECTION_RETRIES:-2}
      - REFLECTION_CRITIC_MODEL=${REFLECTION_CRITIC_MODEL:-gpt-4o-mini}
      - REFLECTION_REVISER_MODEL=${REFLECTION_REVISER_MODEL:-gpt-4o-mini}
      - REFLECTION_PROMPT_VERSION=${REFLECTION_PROMPT_VERSION:-bank-policy-v1}
      - REFLECTION_MIN_EVIDENCE_RELEVANCE=${REFLECTION_MIN_EVIDENCE_RELEVANCE:-0.70}
      - REFLECTION_MIN_CITATION_COMPLETENESS=${REFLECTION_MIN_CITATION_COMPLETENESS:-0.90}
      - REFLECTION_MIN_UTILITY=${REFLECTION_MIN_UTILITY:-4}
      - REFLECTION_MAX_ADDITIONAL_RETRIEVALS=${REFLECTION_MAX_ADDITIONAL_RETRIEVALS:-1}
      - REFLECTION_RETRIEVAL_TOP_K=${REFLECTION_RETRIEVAL_TOP_K:-5}
      - REFLECTION_MAX_EVIDENCE_CHUNKS=${REFLECTION_MAX_EVIDENCE_CHUNKS:-10}
      - REFLECTION_MAX_EVIDENCE_CHARS=${REFLECTION_MAX_EVIDENCE_CHARS:-30000}
      - REFLECTION_MAX_TOTAL_TOKENS=${REFLECTION_MAX_TOTAL_TOKENS:-6000}
      - REFLECTION_MAX_COMPLETION_TOKENS=${REFLECTION_MAX_COMPLETION_TOKENS:-1500}
      - REFLECTION_STAGE_TIMEOUT_SECONDS=${REFLECTION_STAGE_TIMEOUT_SECONDS:-12}
      - REFLECTION_TOTAL_TIMEOUT_SECONDS=${REFLECTION_TOTAL_TIMEOUT_SECONDS:-25}
      - REFLECTION_MAX_ATTEMPTS=${REFLECTION_MAX_ATTEMPTS:-2}
      # HYDE tuning (overridable via host .env)
      - HYDE_MODEL=${HYDE_MODEL:-gpt-4o-mini}
      - HYDE_PROMPT_VERSION=${HYDE_PROMPT_VERSION:-bank-policy-v1}
      - HYDE_NUM_HYPOTHESES=${HYDE_NUM_HYPOTHESES:-3}
      - HYDE_TEMPERATURE=${HYDE_TEMPERATURE:-0.3}
      - HYDE_MAX_COMPLETION_TOKENS=${HYDE_MAX_COMPLETION_TOKENS:-600}
      - HYDE_TIMEOUT_SECONDS=${HYDE_TIMEOUT_SECONDS:-12}
      - HYDE_MAX_ATTEMPTS=${HYDE_MAX_ATTEMPTS:-2}
      # CRAG tuning (overridable via host .env) - enabled/rollout%/web-enabled
      # live in the rag_ops_config DB row, not here (see
      # app/seed/migrations/008_add_crag_rag_ops_config.sql); only static
      # budgets and the web-correction domain allowlist are deployment
      # settings.
      - CRAG_GRADER_MODEL=${CRAG_GRADER_MODEL:-gpt-4o-mini}
      - CRAG_PROMPT_VERSION=${CRAG_PROMPT_VERSION:-bank-policy-v1}
      - CRAG_RELEVANCE_THRESHOLD=${CRAG_RELEVANCE_THRESHOLD:-0.70}
      - CRAG_AMBIGUOUS_THRESHOLD=${CRAG_AMBIGUOUS_THRESHOLD:-0.50}
      - CRAG_MAX_CHUNKS_TO_GRADE=${CRAG_MAX_CHUNKS_TO_GRADE:-8}
      - CRAG_MAX_DOCUMENTS_TO_REFINE=${CRAG_MAX_DOCUMENTS_TO_REFINE:-5}
      - CRAG_MAX_SENTENCES_PER_DOCUMENT=${CRAG_MAX_SENTENCES_PER_DOCUMENT:-80}
      - CRAG_GRADER_TIMEOUT_SECONDS=${CRAG_GRADER_TIMEOUT_SECONDS:-10}
      - CRAG_REFINER_TIMEOUT_SECONDS=${CRAG_REFINER_TIMEOUT_SECONDS:-10}
      - CRAG_MAX_COMPLETION_TOKENS=${CRAG_MAX_COMPLETION_TOKENS:-800}
      - CRAG_MAX_ATTEMPTS=${CRAG_MAX_ATTEMPTS:-2}
      - CRAG_MIN_EVIDENCE_CHUNKS=${CRAG_MIN_EVIDENCE_CHUNKS:-1}
      - CRAG_POLICY_VERSION=${CRAG_POLICY_VERSION:-crag-policy-v1}
      # Approved regulatory-web domains for CRAG's public-correction path -
      # empty by default (web correction stays unavailable, see
      # app.api.deps.get_regulatory_web_retriever) until Legal/Compliance
      # approves a real allowlist for this deployment.
      - CRAG_ALLOWED_REGULATORY_DOMAINS=${CRAG_ALLOWED_REGULATORY_DOMAINS:-}
      - CRAG_WEB_MAX_RESULTS=${CRAG_WEB_MAX_RESULTS:-5}
      # Text-to-SQL (overridable via host .env) - disabled/unconfigured by
      # default. SQL_DATABASE_URL is a separate, read-only-role analytics
      # database (see scripts/sql/provision_sql_reader_role.sql), never this
      # app's own DATABASE_URL above. sql_enabled/sql_rollout_percentage
      # still live in the rag_ops_config DB row (see
      # app/seed/migrations/011_create_text_to_sql.sql), same as CRAG's
      # rollout flags - only static budgets/models are deployment settings.
      - SQL_DATABASE_URL=${SQL_DATABASE_URL:-}
      - SQL_ENABLED_BY_DEFAULT=${SQL_ENABLED_BY_DEFAULT:-false}
      - SQL_GENERATOR_MODEL=${SQL_GENERATOR_MODEL:-gpt-4o}
      - SQL_ROUTER_MODEL=${SQL_ROUTER_MODEL:-gpt-4o-mini}
      - SQL_MIN_ROUTE_CONFIDENCE=${SQL_MIN_ROUTE_CONFIDENCE:-0.90}
      - SQL_STATEMENT_TIMEOUT_MS=${SQL_STATEMENT_TIMEOUT_MS:-5000}
      - SQL_LOCK_TIMEOUT_MS=${SQL_LOCK_TIMEOUT_MS:-500}
      - SQL_MAX_PLAN_COST=${SQL_MAX_PLAN_COST:-100000}
      - SQL_MAX_RESULT_ROWS=${SQL_MAX_RESULT_ROWS:-200}
      - SQL_PROPOSAL_TTL_SECONDS=${SQL_PROPOSAL_TTL_SECONDS:-300}
      - SQL_ALLOWED_SCHEMAS_RAW=${SQL_ALLOWED_SCHEMAS_RAW:-approved_analytics}

    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./seed:/app/seed
    command: ["python", "scripts/serve.py"]


volumes:
  postgres_data:
  qdrant_data: