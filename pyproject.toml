[project]
name = "adv-rag"
version = "0.1.0"
description = "Advanced RAG: Text2SQL + Core RAG + Caching + LLM Security"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    # Settings & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # LLM
    "openai>=1.54.0",
    "tiktoken>=0.8.0",
    # Vector DB & embeddings
    # Floor matches configurable-k RRF (RrfQuery/Rrf(k=...)) and named
    # sparse-vector modifiers, verified against a live Qdrant 1.17.0
    # server (see app.repositories.vector_repository.search_hybrid);
    # ceiling avoids silently resolving an untested 2.x major bump.
    "qdrant-client>=1.17,<2",
    # Doc parsing
    "docling>=2.9.0",
    # Text2SQL: Vanna generates candidate SQL (app.sql.sql_generator); pinned
    # exact minor (not the open-ended >=0.7.0 this repo declared before) per
    # the architecture blueprint's rule against an unconstrained major
    # crossing dependency in a security-sensitive path. qdrant extra reuses
    # this app's existing Qdrant instance as Vanna's example vector store
    # instead of pulling in a second one (chromadb).
    "vanna[openai,postgres,qdrant]>=0.7.0,<0.8",
    # AST parsing/validation for the read-only SQL policy layer
    # (app.sql.sql_policy) - a transpiler/parser, not a security sandbox by
    # itself; PostgreSQL's own EXPLAIN in a read-only transaction is the
    # authoritative validator (see app.sql.sql_executor).
    "sqlglot>=27,<28",
    # Postgres
    "psycopg2-binary>=2.9.10",
    # Cache
    "upstash-redis>=1.2.0",
    # Auth
    "pyjwt>=2.10.0",
    "bcrypt>=4.0.0",
    # Logging
    "loguru>=0.7.2",
    # Agent orchestration
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0",
    # === Phase 2+ deps pinned now to avoid churn ===
    "sentence-transformers>=3.3.0",
    "voyageai>=0.3.0",
    "tavily-python>=0.5.0",
    # === Phase 4 deps ===
    # [onnxruntime] extra (-> optimum[onnxruntime]): MaliciousURLs' default
    # (non-ONNX) model repo, DunnBC22/codebert-base-Malicious_URLs, 401s on
    # the Hub (upstream repo gone) - only an ONNX mirror is available, so
    # the output scanner needs this extra to load it. See
    # app.guardrails.llm_guard_adapter.build_llm_guard_output_scanner.
    "llm-guard[onnxruntime]>=0.3.15",
    "boto3>=1.35.0",
    "pypdf>=5.1.0",
    # === Data pipeline deps ===
    "pyyaml>=6.0",   # config.yaml parsing in scripts/data_pipeline/
    "faker>=33.0.0", # synthetic K8s ops SQL generation
    "fastembed>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ragas>=0.2.0",
    "reportlab>=4.2.0",  # PDF generation in scripts/data_pipeline/05_diversify_true_formats.py
    "python-docx>=1.1.0",  # DOCX generation in scripts/data_pipeline/05_diversify_true_formats.py
    "streamlit>=1.40.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# "slow" tests load real LLM Guard transformer models (see
# tests/guardrails/test_llm_guard_adapter.py) - minutes on a cold cache and
# a hard failure in a network-restricted environment, so they're opt-in:
#   uv run pytest -m slow tests/guardrails/test_llm_guard_adapter.py
markers = [
    "slow: requires downloading/loading real ML models; excluded by default",
]
addopts = "-m 'not slow'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
